<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILD BLUE 1st album CURVE</title>

  <!-- 전체 폰트: 원하는 Google Font로 바꿔도 됩니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #FBE5D6;
      --accent-hover: #FFF7F1;
      --orange-shadow: rgba(230, 150, 90, 0.13);
      --orange-shadow-hover: rgba(230, 150, 90, 0.18);

      /* 배경을 더 연하게 하고 싶으면 0.45를 0.6~0.75로 올리기,
         배경을 더 진하게 보이게 하고 싶으면 0.2~0.35로 내리기 */
      --bg-overlay: 0.45;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 1px 0 36px;

      /* 이 HTML과 같은 폴더에 background.jpg를 두면 바로 적용됩니다. */
      background:
        linear-gradient(
          rgba(255, 255, 255, var(--bg-overlay)),
          rgba(255, 255, 255, var(--bg-overlay))
        ),
        url("background2.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: "Noto Sans KR", Arial, sans-serif;
      color: #2c2724;
    }

    #mainTable {
      width: 92%;
      max-width: 410px;
      margin: 72px auto 0;
      padding: 24px;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 10px 35px rgba(100, 60, 20, 0.18);

      border-collapse: separate;
      border-spacing: 12px 8px;

      text-align: center;
      vertical-align: middle;
      font-size: 15px;
    }

    #battleNumber {
      padding-bottom: 10px;
      line-height: 1.35;
      font-size: 14px;
    }

    #leftField,
    #rightField {
      width: 150px;
      height: 150px;
      padding: 12px;

      background: #fff;
      border: none;
      border-radius: 20px;

      /* mainTable보다 훨씬 약한, 살짝 주황빛 그림자 */
      box-shadow: 0 3px 10px var(--orange-shadow);

      vertical-align: middle;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background-color 0.18s ease;
    }

    /* PC처럼 실제 hover가 있는 기기에서만 적용 */
    @media (hover: hover) {
      #leftField:hover,
      #rightField:hover {
        background-color: var(--accent-hover);
        transform: translateY(-4px);
        box-shadow: 0 7px 16px var(--orange-shadow-hover);
      }
    }

    /* 모바일/PC 모두 클릭하는 순간 */
    #leftField:active,
    #rightField:active {
      background-color: var(--accent);
      transform: scale(0.97);
    }

    #resultField {
      width: 100%;
      text-align: center;
    }

    .resultTable {
      width: min(88%, 290px);
      margin: 24px auto 0;

      background: #fff;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(230, 150, 90, 0.13);

      font-size: 13px;
      text-align: left;
    }

    .resultTable th {
      padding: 10px;
      background: var(--accent);
      text-align: center;
      font-weight: 700;
    }

    .resultTable td {
      padding: 9px 10px;
      background: #fff;
      border-top: 1px solid #f4e7dd;
      vertical-align: middle;
    }

    .resultTable .rankCell {
      width: 48px;
      text-align: center;
    }

    #restartArea {
      text-align: center;
    }

    #restartButton {
      display: none;
      margin: 18px auto 0;
      padding: 10px 24px;

      border: none;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 3px 10px var(--orange-shadow);

      font: inherit;
      font-size: 13px;
      color: #2c2724;
      cursor: pointer;

      transition:
        transform 0.18s ease,
        background-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    @media (hover: hover) {
      #restartButton:hover {
        transform: translateY(-2px);
        background: #f8d8c2;
        box-shadow: 0 6px 14px var(--orange-shadow-hover);
      }
    }

    #restartButton:active {
      transform: scale(0.97);
    }

    #extraContent {
      width: 100%;
      text-align: center;
    }

    .youtubeBox {
      width: min(90%, 500px);
      margin: 34px auto 12px;
    }

    .youtubeBox iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(230, 150, 90, 0.10);
    }

    .youtubePlaceholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      padding: 18px;

      background: rgba(255, 255, 255, 0.84);
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(230, 150, 90, 0.10);

      color: rgba(60, 45, 35, 0.55);
      font-size: 12px;
      line-height: 1.6;
    }

    .watermark {
      margin: 14px 0 0;
      padding: 0 16px;
      font-size: 11px;
      color: rgba(80, 60, 45, 0.48);
    }

    /* 모바일 */
    @media (max-width: 600px) {
      body {
        min-height: 100svh;
        padding-bottom: 24px;
        background-attachment: scroll;
      }

      #mainTable {
        width: 94%;
        max-width: none;
        margin-top: 30px;
        padding: 17px 11px;
        border-radius: 24px;
        border-spacing: 7px 6px;
      }

      #battleNumber {
        font-size: 13px;
        padding-bottom: 7px;
      }

      #leftField,
      #rightField {
        width: 42vw;
        max-width: 150px;
        height: 132px;
        padding: 9px;
        border-radius: 18px;
        font-size: 13px;
      }

      .resultTable {
        width: 88%;
        max-width: 300px;
        margin-top: 20px;
      }

      .youtubeBox {
        width: 92%;
        margin-top: 28px;
      }

      .watermark {
        font-size: 10px;
      }
    }

    /* 아주 작은 화면 */
    @media (max-width: 360px) {
      #mainTable {
        width: 96%;
        padding-left: 8px;
        padding-right: 8px;
        border-spacing: 5px 5px;
      }

      #leftField,
      #rightField {
        width: 43vw;
        height: 122px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <table id="mainTable" aria-label="CURVE song sorter">
    <tr>
      <td id="battleNumber" colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td id="leftField" onclick="if(finishFlag===0) sortList(-1);">&nbsp;</td>
      <td id="rightField" onclick="if(finishFlag===0) sortList(1);">&nbsp;</td>
    </tr>
  </table>

  <div id="resultField"></div>

  <div id="restartArea">
    <button id="restartButton" type="button" onclick="restartSort()">다시 시작</button>
  </div>

  <!-- 이 영역은 결과가 떠도 사라지지 않습니다. -->
  <div id="extraContent">
    <div class="youtubeBox">
<iframe   
	src="https://www.youtube.com/embed/3OeVuIP2uKM"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
    </div>

    <p class="watermark">@naruttang</p>
  </div>

  <script>
    const namMember = [
      "EGO",
      "はやびきぶる〜す",
      "Freaky Friday",
      "Automatico",
      "Better than yesterday",
      "カスミソウ",
      "Make rules",
      "Afterglow"
      "Astrist",
      "君の笑顔とあの空",
      "Glitch",
      "You",
      "Thankful Days"
    ];

    let lstMember = [];
    let parent = [];
    let equal = [];
    let rec = [];
    let cmp1, cmp2;
    let head1, head2;
    let nrec;

    let numQuestion;
    let totalSize;
    let finishSize;
    let finishFlag;

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function initList() {
      let n = 0;
      let mid;
      let i;

      lstMember = [];
      parent = [];
      equal = [];
      rec = [];

      /* namMember 자체는 그대로 두고, 인덱스 순서만 매번 랜덤화 */
      lstMember[n] = [];
      for (i = 0; i < namMember.length; i++) {
        lstMember[n][i] = i;
      }
      shuffleArray(lstMember[n]);

      parent[n] = -1;
      totalSize = 0;
      n++;

      for (i = 0; i < lstMember.length; i++) {
        if (lstMember[i].length >= 2) {
          mid = Math.ceil(lstMember[i].length / 2);

          lstMember[n] = lstMember[i].slice(0, mid);
          totalSize += lstMember[n].length;
          parent[n] = i;
          n++;

          lstMember[n] = lstMember[i].slice(mid, lstMember[i].length);
          totalSize += lstMember[n].length;
          parent[n] = i;
          n++;
        }
      }

      for (i = 0; i < namMember.length; i++) {
        rec[i] = 0;
      }
      nrec = 0;

      for (i = 0; i <= namMember.length; i++) {
        equal[i] = -1;
      }

      cmp1 = lstMember.length - 2;
      cmp2 = lstMember.length - 1;
      head1 = 0;
      head2 = 0;
      numQuestion = 1;
      finishSize = 0;
      finishFlag = 0;
    }

    function sortList(flag) {
      let i;
      let str;

      if (flag < 0) {
        rec[nrec] = lstMember[cmp1][head1];
        head1++;
        nrec++;
        finishSize++;
        while (equal[rec[nrec - 1]] !== -1) {
          rec[nrec] = lstMember[cmp1][head1];
          head1++;
          nrec++;
          finishSize++;
        }
      } else if (flag > 0) {
        rec[nrec] = lstMember[cmp2][head2];
        head2++;
        nrec++;
        finishSize++;
        while (equal[rec[nrec - 1]] !== -1) {
          rec[nrec] = lstMember[cmp2][head2];
          head2++;
          nrec++;
          finishSize++;
        }
      } else {
        rec[nrec] = lstMember[cmp1][head1];
        head1++;
        nrec++;
        finishSize++;
        while (equal[rec[nrec - 1]] !== -1) {
          rec[nrec] = lstMember[cmp1][head1];
          head1++;
          nrec++;
          finishSize++;
        }

        equal[rec[nrec - 1]] = lstMember[cmp2][head2];
        rec[nrec] = lstMember[cmp2][head2];
        head2++;
        nrec++;
        finishSize++;

        while (equal[rec[nrec - 1]] !== -1) {
          rec[nrec] = lstMember[cmp2][head2];
          head2++;
          nrec++;
          finishSize++;
        }
      }

      if (head1 < lstMember[cmp1].length && head2 === lstMember[cmp2].length) {
        while (head1 < lstMember[cmp1].length) {
          rec[nrec] = lstMember[cmp1][head1];
          head1++;
          nrec++;
          finishSize++;
        }
      } else if (head1 === lstMember[cmp1].length && head2 < lstMember[cmp2].length) {
        while (head2 < lstMember[cmp2].length) {
          rec[nrec] = lstMember[cmp2][head2];
          head2++;
          nrec++;
          finishSize++;
        }
      }

      if (head1 === lstMember[cmp1].length && head2 === lstMember[cmp2].length) {
        for (i = 0; i < lstMember[cmp1].length + lstMember[cmp2].length; i++) {
          lstMember[parent[cmp1]][i] = rec[i];
        }

        lstMember.pop();
        lstMember.pop();
        cmp1 -= 2;
        cmp2 -= 2;
        head1 = 0;
        head2 = 0;

        for (i = 0; i < namMember.length; i++) {
          rec[i] = 0;
        }
        nrec = 0;
      }

      if (cmp1 < 0) {
        str = "Battle No." + (numQuestion - 1) + "<br>100% sorted.";
        document.getElementById("battleNumber").innerHTML = str;

        showResult();
        finishFlag = 1;
        document.getElementById("restartButton").style.display = "inline-block";
      } else {
        showImage();
      }
    }

    function showResult() {
      let ranking = 1;
      let sameRank = 1;
      let str = "";

      str += '<table class="resultTable">';
      str += '<tr><th>순위</th><th>이름</th></tr>';

      for (let i = 0; i < namMember.length; i++) {
        str += '<tr><td class="rankCell">' + ranking + '</td><td>' + namMember[lstMember[0][i]] + '</td></tr>';

        if (i < namMember.length - 1) {
          if (equal[lstMember[0][i]] === lstMember[0][i + 1]) {
            sameRank++;
          } else {
            ranking += sameRank;
            sameRank = 1;
          }
        }
      }

      str += '</table>';
      document.getElementById("resultField").innerHTML = str;
    }

    function showImage() {
      const percentage = totalSize === 0 ? 100 : Math.floor((finishSize * 100) / totalSize);
      const str0 = "Battle No." + numQuestion + "<br>" + percentage + "% sorted.";

      document.getElementById("battleNumber").innerHTML = str0;
      document.getElementById("leftField").textContent = namMember[lstMember[cmp1][head1]];
      document.getElementById("rightField").textContent = namMember[lstMember[cmp2][head2]];

      numQuestion++;
    }

    function restartSort() {
      document.getElementById("resultField").innerHTML = "";
      document.getElementById("restartButton").style.display = "none";

      initList();
      showImage();

      /* 다시 시작했을 때 위의 소트 카드 쪽으로 부드럽게 이동 */
      document.getElementById("mainTable").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    initList();
    showImage();
  </script>
</body>
</html>
